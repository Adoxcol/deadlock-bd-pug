services:
  app:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dbd:${POSTGRES_PASSWORD}@db:5432/dbd
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [app]
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: dbd, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: dbd }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dbd"], interval: 5s, retries: 10 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped
  # Optional: self-hosted deadlock-api live-events (MIT). Set LIVE_EVENTS_URL=http://live-events:3000
  live-events:
    image: ghcr.io/deadlock-api/deadlock-live-events:latest
    profiles: ["live"]
    environment: { DEADLOCK_API_KEY: "${DEADLOCK_API_KEY:-}" }
    restart: unless-stopped
volumes: { pgdata: {}, caddy_data: {} }
