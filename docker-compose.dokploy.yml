# For Dokploy: its Traefik replaces Caddy, so set the domain in Dokploy's Domains tab (service: app, port: 3001).
# Dokploy writes .env from its Environment tab. Leave out unset URL settings: a blank one fails validation.
services:
  app:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dbd:${POSTGRES_PASSWORD}@db:5432/dbd
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
    mem_limit: 1g
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: dbd, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: dbd }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dbd"], interval: 5s, retries: 10 }
    mem_limit: 512m
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    mem_limit: 128m
    restart: unless-stopped
volumes: { pgdata: {} }
